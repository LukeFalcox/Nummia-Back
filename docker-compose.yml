services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nummia
      POSTGRES_USER: ${DB_USERNAME:-nummia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nummia}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nummia} -d nummia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/nummia
      DB_USERNAME: ${DB_USERNAME:-nummia}
      DB_PASSWORD: ${DB_PASSWORD:-nummia}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      AI_WEBHOOK_URL: ${AI_WEBHOOK_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AUTOMATION_WEBHOOK_URL: ${AUTOMATION_WEBHOOK_URL:-}
      AUTOMATION_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:-}

  # Opcional: docker compose --profile automation up
  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  postgres-data:
  n8n-data:
