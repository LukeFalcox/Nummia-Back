# Por padrão a API usa o banco do Supabase (perfil "supabase").
#   docker compose up --build
#
# Para usar um PostgreSQL local, defina no .env:
#   SPRING_PROFILES_ACTIVE=prod
#   DB_URL=jdbc:postgresql://postgres:5432/nummia
#   DB_USERNAME=nummia / DB_PASSWORD=nummia
# e rode: docker compose --profile local-db up --build
services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,supabase}

  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: nummia
      POSTGRES_USER: ${DB_USERNAME:-nummia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nummia}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Opcional: docker compose --profile automation up
  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  postgres-data:
  n8n-data:
