# Banco de dados no Supabase (PostgreSQL gerenciado).
# A senha NUNCA deve ser versionada: informe via variável de ambiente DB_PASSWORD.
#
# As tabelas ficam no schema "nummia" (e não em "public") para que NÃO sejam
# expostas pela API REST automática do Supabase (PostgREST), que publica o
# schema "public" por padrão.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db.upumrylyyiilgxnpgdlr.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      schema: ${DB_SCHEMA:nummia}
  flyway:
    schemas: ${DB_SCHEMA:nummia}
    default-schema: ${DB_SCHEMA:nummia}
    create-schemas: true
  jpa:
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:nummia}
