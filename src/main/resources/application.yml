spring:
  application:
    name: nummia
  profiles:
    # Por enquanto o banco padrão é o Supabase. Para usar um PostgreSQL local:
    # SPRING_PROFILES_ACTIVE=dev
    default: dev,supabase
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nummia}
    username: ${DB_USERNAME:nummia}
    password: ${DB_PASSWORD:nummia}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  web:
    locale: pt_BR

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

nummia:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:nummia}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    # URL do serviço de IA (ex.: webhook do n8n ou serviço Python/LangGraph).
    # Vazio = assistente local baseado em regras.
    webhook-url: ${AI_WEBHOOK_URL:}
    api-key: ${AI_API_KEY:}
    timeout: ${AI_TIMEOUT:30s}
    history-size: 10
  automation:
    # Webhook que recebe eventos (ex.: notificações) para automações no n8n.
    webhook-url: ${AUTOMATION_WEBHOOK_URL:}
    secret: ${AUTOMATION_WEBHOOK_SECRET:}
